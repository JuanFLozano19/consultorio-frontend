<main class="login">
  <div class="panel">
    <a routerLink="/" class="brand" aria-label="Volver a la página principal">
      <app-logo [size]="56" />
    </a>
    <h1>Acceso del consultorio</h1>
    <p class="sub">Solo para el doctor y su equipo.</p>

    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }
      <button type="submit" class="btn" [disabled]="enviando()">{{ enviando() ? 'Entrando…' : 'Entrar' }}</button>
    </form>
  </div>
</main>
