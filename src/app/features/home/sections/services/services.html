<section id="servicios" class="band band--sand">
  <div class="wrap">
    <div class="section-head" appReveal>
      <p class="eyebrow">Servicios</p>
      <h2>Lo que hacemos en consulta</h2>
      <p>
        Atención particular, sin filas ni afanes. Si no ves lo que necesitas, escríbenos y te
        orientamos.
      </p>
    </div>
    <div class="services">
      @for (s of servicios(); track s.id; let i = $index) {
        <article class="svc" [appReveal]="i * 90">
          <app-icon class="svc__icon" [name]="s.icono" />
          <div>
            <h3>{{ s.nombre }}</h3>
            <p>{{ s.descripcion }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
