<header class="header" [class.header--compacto]="compacto()" [class.header--menu]="menuAbierto()">
  @if (navidad) {
    <app-guirnalda class="header__luces header__luces--ancho" [cantidad]="28" />
    <app-guirnalda class="header__luces header__luces--movil" [cantidad]="11" />
  }
  <div class="wrap nav">
    <a
      class="brand"
      href="#inicio"
      [attr.aria-label]="doctor.name + ' ' + doctor.title + ', ir al inicio'"
      (click)="menuAbierto.set(false)"
    >
      <span class="brand__logo">
        <app-logo [size]="44" class="brand__mark" />
        @if (navidad) {
          <svg class="gorrito" viewBox="0 0 60 48" aria-hidden="true">
            <path d="M6 38 C 14 14 34 4 50 14 C 44 20 42 28 44 38 Z" fill="#c0533a" />
            <path
              d="M50 14 C 56 18 58 26 54 30"
              stroke="#c0533a"
              stroke-width="7"
              fill="none"
              stroke-linecap="round"
            />
            <circle cx="54" cy="31" r="6" fill="#f6efe4" />
            <rect x="2" y="34" width="46" height="11" rx="5.5" fill="#f6efe4" />
          </svg>
        }
      </span>
      <span>
        <span class="brand__name">{{ doctor.name }}</span>
        <span class="brand__sub">{{ doctor.title.toUpperCase() }}</span>
      </span>
    </a>
    <nav class="links" aria-label="Secciones">
      @for (l of links; track l.href) {
        <a
          [href]="l.href"
          [class.activo]="activo() === l.href"
          [attr.aria-current]="activo() === l.href ? 'location' : null"
          >{{ l.label }}</a
        >
      }
    </nav>
    <div class="nav__der">
      <button
        type="button"
        class="tema"
        (click)="alternarTema()"
        [attr.aria-label]="oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.title]="oscuro() ? 'Modo claro' : 'Modo oscuro'"
      >
        @if (oscuro()) {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
            />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
        }
      </button>
      <button
        type="button"
        class="tema letra"
        (click)="alternarLetra()"
        [attr.aria-pressed]="letraGrande()"
        [attr.aria-label]="letraGrande() ? 'Volver a la letra normal' : 'Agrandar la letra'"
        [attr.title]="letraGrande() ? 'Letra normal' : 'Letra más grande'"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <text
            x="2"
            y="18"
            font-size="13"
            font-weight="600"
            fill="currentColor"
            font-family="inherit"
          >
            A
          </text>
          <text
            x="11"
            y="19"
            font-size="18"
            font-weight="600"
            fill="currentColor"
            font-family="inherit"
          >
            A
          </text>
        </svg>
      </button>
      <a class="btn nav__cta" href="#reserva">Reservar cita</a>
      <button
        type="button"
        class="burger"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-movil"
        [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
        (click)="alternarMenu()"
      >
        <span></span><span></span>
      </button>
    </div>
  </div>

  <nav id="menu-movil" class="movil" aria-label="Menú" [attr.inert]="menuAbierto() ? null : ''">
    <div class="wrap movil__inner">
      @for (l of links; track l.href; let i = $index) {
        <a
          [href]="l.href"
          [style.transition-delay.ms]="menuAbierto() ? 60 + i * 40 : 0"
          (click)="menuAbierto.set(false)"
          >{{ l.label }}</a
        >
      }
      <button
        type="button"
        class="movil__letra"
        (click)="alternarLetra()"
        [attr.aria-pressed]="letraGrande()"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <text
            x="2"
            y="18"
            font-size="13"
            font-weight="600"
            fill="currentColor"
            font-family="inherit"
          >
            A
          </text>
          <text
            x="11"
            y="19"
            font-size="18"
            font-weight="600"
            fill="currentColor"
            font-family="inherit"
          >
            A
          </text>
        </svg>
        {{ letraGrande() ? 'Volver a la letra normal' : 'Letra más grande' }}
      </button>
      <a class="btn" href="#reserva" (click)="menuAbierto.set(false)">Reserva tu consulta</a>
    </div>
  </nav>
</header>
